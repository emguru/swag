[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swag-rag"
version = "0.3.0"
description = "Semantic Weighted Augmented Generation — retrieval reranking for RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Automatico" }]
keywords = ["rag", "retrieval", "reranking", "semantic-search", "faiss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "qdrant-client>=1.12",
    "pypdf>=3.0",
    "python-docx>=1.0",
    "openai>=1.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swag = "swag.cli:main"

[project.urls]
Homepage = "https://github.com/automatico/SWAG"
Documentation = "https://github.com/automatico/SWAG/blob/main/docs/BUILD_AND_USAGE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["swag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
